# El taller en el portátil (Fase 8): la base y la aplicación. El de desarrollo es docker-compose.yml (solo la base).
# Los valores salen del .env de esta carpeta (lo crea el instalador; ver .env.example, sección «Taller»). Si falta
# uno obligatorio, docker compose no arranca y dice cuál. Uso:
#   docker compose -f docker-compose.taller.yml up -d
# La imagen de la app no se baja de internet: se carga con docker load (la construye el desarrollador).
# Proyecto propio («taller»): no se mezcla con el contenedor ni el volumen de la base de desarrollo.
name: taller

services:
  db:
    # Al subir de versión mayor (18 -> 19), el volumen cambia con ella (datos-pg19): actualizar.ps1 pasa los datos al
    # nuevo con pg_dump | pg_restore y deja el anterior intacto. En la misma mayor (18.x) se usa el mismo volumen.
    # El cliente postgresql<mayor>-client del Dockerfile sube junto con esta imagen.
    image: postgres:18.6-alpine
    restart: unless-stopped
    # Sin puerto publicado: la base solo se ve dentro de la red de Docker, nunca desde la Wi-Fi.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en el .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en el .env}
      # Usuario de la app (sin superusuario); lo crea scripts/taller/base al iniciar una base vacía.
      TALLER_DB_USUARIO: ${TALLER_DB_USUARIO:?Falta TALLER_DB_USUARIO en el .env}
      TALLER_DB_CLAVE: ${TALLER_DB_CLAVE:?Falta TALLER_DB_CLAVE en el .env}
      TZ: America/Bogota
    volumes:
      - datos-pg18:/var/lib/postgresql
      - ./scripts/taller/base:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: taller-motos:${TALLER_VERSION:-0.1.7}
    pull_policy: never
    restart: unless-stopped
    init: true
    # Tiempo para la copia al cerrar antes de que Docker mate el proceso (por defecto son 10 s).
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    # Solo las variables que la app usa: el superusuario de la base no le llega.
    environment:
      DATABASE_URL: postgresql://${TALLER_DB_USUARIO}:${TALLER_DB_CLAVE}@db:5432/${POSTGRES_DB}
      SESION_SECRETO: ${SESION_SECRETO:?Falta SESION_SECRETO en el .env}
      COOKIE_SEGURA: ${COOKIE_SEGURA:-no}
      LICENCIA_URL: ${LICENCIA_URL:-}
      COPIAS_FRASE: ${COPIAS_FRASE:?Falta COPIAS_FRASE en el .env}
      # Con una segunda carpeta, las copias van a las dos.
      COPIAS_DESTINOS: /copias/local${COPIAS_CARPETA_NUBE:+;/copias/nube}
      # Aviso de versión nueva en la app: lo deja Windows (scripts/taller/comun.ps1, Escribir-AvisoApp).
      AVISO_VERSION_CARPETA: /aviso
    ports:
      - "${TALLER_PUERTO:-80}:3100"
      # Solo el portátil: aquí no llega la Wi-Fi. La configuración inicial (primer uso) se acepta solo por este puerto,
      # porque dentro de Docker todo llega desde la red de Docker y la app no distingue el portátil de un celular.
      - "127.0.0.1:${TALLER_PUERTO_EQUIPO:-3101}:3101"
    volumes:
      - ${COPIAS_CARPETA_LOCAL:?Falta COPIAS_CARPETA_LOCAL en el .env}:/copias/local
      # Sin segunda carpeta se monta un volumen vacío que la app no usa (COPIAS_DESTINOS no lo nombra).
      - ${COPIAS_CARPETA_NUBE:-copias-sin-segunda}:/copias/nube
      # Solo la subcarpeta del aviso y solo para leer (no estado.json ni las descargas). Nunca el socket de Docker: con
      # él la app podría controlar el portátil; para avisar basta leer un número de versión.
      - ./actualizacion/aviso:/aviso:ro

volumes:
  datos-pg18:
  copias-sin-segunda:
